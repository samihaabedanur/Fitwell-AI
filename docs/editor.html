<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitwell · Material Editor</title><style>body{margin:0;background:#eef1e9;color:#19352d;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;border-bottom:1px solid #bdcbbf;padding-bottom:14px}.layout{display:grid;grid-template-columns:1fr 310px;gap:16px;margin-top:20px}.scene{height:620px;border-radius:18px;background:linear-gradient(150deg,#dceae0,#aac1b4);perspective:900px;position:relative;overflow:hidden}.room{position:absolute;left:12%;top:20%;width:76%;height:62%;transform:rotateX(57deg) rotateZ(-2deg);transform-style:preserve-3d;background:#c8b99f;transition:.2s}.floor{position:absolute;inset:0;background:#c8b99f}.ceiling{position:absolute;left:0;right:0;top:-32%;height:32%;background:#bdcdbd;transform:rotateX(-90deg);transform-origin:bottom}.wall{position:absolute;left:-12%;top:0;bottom:0;width:12%;background:#abc3b3;transform:rotateY(90deg);transform-origin:right}.surface{cursor:pointer}.selected{outline:3px solid white}.sofa{position:absolute;left:36%;top:38%;width:28%;height:19%;background:#6f8978;border-radius:10px;box-shadow:0 13px #526c5d}.panel{background:#fafbf7;border:1px solid #bdcbbf;border-radius:16px;padding:18px}.panel button,.panel input{font:inherit;padding:9px;border:0;border-radius:9px}.tabs,.swatches{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tabs button{background:#e3e9e0}.tabs .active{background:#19352d;color:white}.swatches{max-height:320px;overflow:auto;margin:8px 0}.swatch{min-height:54px;text-align:left;background:var(--c);border:2px solid transparent!important}.swatch.active{border-color:#19352d!important}.label{display:block;color:#587269;margin-top:12px}.primary{width:100%;background:#c8ef88}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #e2e8e2;padding:5px;color:#587269}.metric b{color:#19352d}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style><main><header><strong>FITWELL</strong><nav><a href="./index.html">Home</a> · <a href="./studio.html">Workspace</a></nav></header><h1>Material room editor</h1><p>Choose any material from Fitwell’s dataset-backed library and apply it to the selected surface.</p><div class="layout"><section class="scene"><div class="room" id="room"><div class="surface floor" data-surface="floor"></div><div class="surface ceiling" data-surface="ceiling"></div><div class="surface wall" data-surface="wall"></div><div class="sofa"></div></div></section><aside class="panel"><strong id="chosen">Floor selected</strong><h2>Material selections</h2><div class="tabs"><button class="active" data-pick="floor">Floor</button><button data-pick="wall">Wall</button><button data-pick="ceiling">Ceiling</button><button data-pick="all">All surfaces</button></div><span class="label">Fitwell dataset · <span id="count"></span> materials</span><div class="swatches" id="swatches"></div><span class="label">Room size</span><label>Width <output id="wo">8.0 m</output></label><input id="w" type="range" min="4" max="16" step=".1" value="8"><label>Depth <output id="do">6.0 m</output></label><input id="d" type="range" min="3" max="12" step=".1" value="6"><label>Height <output id="ho">3.0 m</output></label><input id="h" type="range" min="2.4" max="6" step=".1" value="3"><button class="primary" id="reset">Reset room</button><hr><div class="metric"><span>Volume</span><b id="vol"></b></div><div class="metric"><span>Surface area</span><b id="area"></b></div><div class="metric"><span>Shape efficiency</span><b id="eff"></b></div><div class="metric"><span>Carbon reference</span><b id="co2"></b></div></aside></div></main><script>const names=['Animal skin','Bone/teeth/horn','Brickwork','Cardboard','Carpet/rug','Ceiling tile','Ceramic','Concrete','Cork/corkboard','Engineered stone','Fabric/cloth','Foliage','Glass','Leather','Metal','Mirror','Paint/plaster/enamel','Plastic, clear','Plastic, non-clear','Stone, natural','Stone, polished','Tile','Wallpaper','Water','Wax','Wicker','Wood','Wood, tree','Asphalt'];const colors=['#b78657','#d5d0c2','#ad654d','#c5b08d','#9a806d','#d6d4c8','#caa883','#aeb5ae','#b99a6b','#b5afa4','#9b796e','#73966d','#b9d4d6','#80624e','#667077','#b8c3c5','#b5aa99','#d5e4e8','#777b78','#b9b3a4','#a6a096','#bd7658','#b6a9a5','#91c5cb','#eed58b','#a78e6f','#bd8b58','#8c704f','#76767b'];const surfaces={floor:document.querySelector('[data-surface="floor"]'),wall:document.querySelector('[data-surface="wall"]'),ceiling:document.querySelector('[data-surface="ceiling"]')};let target='floor';const list=document.querySelector('#swatches');names.forEach((n,i)=>{const b=document.createElement('button');b.className='swatch';b.textContent=n;b.style.setProperty('--c',colors[i]);b.onclick=()=>{(target==='all'?Object.keys(surfaces):[target]).forEach(k=>surfaces[k].style.background=colors[i]);document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b))};list.append(b)});document.querySelector('#count').textContent=names.length;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{target=b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#chosen').textContent=(target==='all'?'All surfaces':target[0].toUpperCase()+target.slice(1))+' selected'});const room=document.querySelector('#room'),w=document.querySelector('#w'),d=document.querySelector('#d'),h=document.querySelector('#h');function update(){const a=+w.value,b=+d.value,c=+h.value;room.style.width=(52+a*2.75)+'%';room.style.height=(44+b*3.5)+'%';wo.textContent=a.toFixed(1)+' m';do.textContent=b.toFixed(1)+' m';ho.textContent=c.toFixed(1)+' m';vol.textContent=(a*b*c).toFixed(1)+' m³';area.textContent=(2*(a*b+a*c+b*c)).toFixed(1)+' m²';eff.textContent=Math.min(99,73.3*(a*b*c/5000)**.08).toFixed(1)+'%';co2.textContent=Math.round(28916.45*(a*b*c/5000)).toLocaleString()+' kg CO₂e*'}[w,d,h].forEach(x=>x.oninput=update);reset.onclick=()=>location.reload();update()</script></html>
