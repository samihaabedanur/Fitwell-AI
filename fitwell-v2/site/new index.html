<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FITWELL · Material Finder (standalone)</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e3e1dc;--acc:#e8631a}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#f1efea;--mute:#a09e98;--line:#34332f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header b{font-size:18px}header span{color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:20px 24px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
#stage{position:relative;display:inline-block;max-width:100%;cursor:crosshair}
#stage img,#stage canvas{display:block;max-width:100%;height:auto;border-radius:8px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.drop{border:2px dashed var(--line);border-radius:10px;padding:36px;text-align:center;color:var(--mute);cursor:pointer}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;font-size:12px;background:var(--card)}
.sw:hover{border-color:var(--acc)}.sw .chip{aspect-ratio:1.6;background:var(--line)}
.sw div.t{padding:6px 8px}.mut{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{color:var(--mute);width:42%}
#three{width:100%;height:340px;border-radius:8px;background:#222;touch-action:none}
</style></head><body>
<header><b>FITWELL</b><span>click any surface in your photo to identify it, source it, and preview it in 3D · runs entirely in your browser</span></header>
<main>
<section>
  <div class="card"><h3>1 · Photo</h3>
    <div id="dz" class="drop">Drop a photo here, or click to choose<input id="file" type="file" accept="image/*" hidden></div>
    <div id="stage" hidden><img id="photo" alt="uploaded"><canvas id="ov"></canvas></div>
    <div class="row" style="margin-top:10px" id="ctl" hidden>
      <label class="mut">Selection tolerance <input id="tol" type="range" min="4" max="40" value="14"></label>
      <button class="ghost" id="newp">New photo</button><span class="mut" id="busy"></span></div>
  </div>
  <div class="card"><h3>Browse catalogue</h3>
    <div class="row"><input id="q" type="text" placeholder="Search name or vendor">
      <select id="cat"><option value="">All categories</option></select>
      <input id="mp" type="text" size="8" placeholder="Max €/m²"><input id="mg" type="text" size="8" placeholder="Max kgCO₂e">
      <button id="go" class="ghost">Search</button></div>
    <div class="row" style="margin-top:8px"><label class="mut">Use your own catalogue: <input id="csv" type="file" accept=".csv"></label></div>
    <p class="mut" id="tot"></p><div class="grid" id="browse"></div></div>
</section>
<section>
  <div class="card"><h3>2 · Material</h3><div id="info" class="mut">Nothing selected yet.</div></div>
  <div class="card"><h3>3 · 3D materiality</h3>
    <div id="three"></div>
    <div class="row" style="margin-top:10px">
      <select id="shape"><option>sphere</option><option>cube</option><option>wall</option></select>
      <label class="mut">Tiling <input id="tile" type="range" min="1" max="8" step=".5" value="2"></label>
      <label class="mut">Relief <input id="disp" type="range" min="0" max=".15" step=".005" value=".03"></label>
      <label class="mut">Light <input id="light" type="range" min="0" max="6.28" step=".05" value="1"></label></div></div>
  <div class="card"><h3>Vendors &amp; similar colours</h3><div class="grid" id="sims"><span class="mut">Select an area first.</span></div></div>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);

['Board-marked concrete','concrete','Demo Cement',55,38,'Lyon','FR',45.76,4.84,'#8d8d8a'],['Polished concrete','concrete','Demo Cement',70,41,'Lyon','FR',45.76,4.84,'#a2a29f'],

// ---------- catalogue ----------

  const n=(r,k)=>{const i=h.indexOf(k);const v=i<0?'':r[i].trim();return v===''?null:v},num=(r,k)=>{const v=n(r,k);return v==null||isNaN(+v)?null:+v};

  $('cat').length=1;browse();if(curCat)apply(curCat)};

  return `<table><tr><td>Vendor</td><td>${m.vendor?(m.vendor_url?`<a href="${m.vendor_url}" target="_blank" rel="noopener">${m.vendor}</a>`:m.vendor):'–'}</td></tr>
  <tr><td>Price</td><td>${money(m.price)} / m²</td></tr><tr><td>Origin</td><td>${[m.city,m.country].filter(Boolean).join(', ')||'–'}${m.distance_km!=null?` · ${m.distance_km} km from site`:''}</td></tr>
  <tr><td>Lead time</td><td>${m.lead!=null?m.lead+' days':'–'}</td></tr><tr><td>GWP (kgCO₂e/m²)</td><td>${g??'–'}<div class="bar"><i style="width:${w}%"></i></div></td></tr>
  <tr><td>Specs</td><td>${m.specs||'–'}</td></tr></table>`}
const chip=m=>`<div class="chip" style="background:${m.color||COL[m.category]||'#999'}"></div>`;

function browse(){const q=$('q').value.toLowerCase(),c=$('cat').value,mp=parseFloat($('mp').value),mg=parseFloat($('mg').value);

  const L=CAT.filter(m=>(!q||(m.name||'').toLowerCase().includes(q)||(m.vendor||'').toLowerCase().includes(q))&&(!c||m.category==c)&&(isNaN(mp)||(m.price!=null&&m.price<=mp))&&(isNaN(mg)||(m.gwp!=null&&m.gwp<=mg))).slice(0,60);

function choose(m){$('info').innerHTML=`<div class="row"><span class="pill">${m.category}</span><b>${m.name}</b></div>`+props(m);setPBR(pbr(procedural(m),m.category),m.category)}
// ---------- image handling ----------
let W=0,H=0,cv=null,PIX=null,LAB=null,curCat=null,curMean=null,curCrop=null;

    for(let y=0;y<h;y++){o[y*w+x]=s/n;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x]}}return o}
function lab(r,g,b){const f=c=>{c/=255;return c>.04045?Math.pow((c+.055)/1.055,2.4):c/12.92},R=f(r),G=f(g),B=f(b),

$('dz').onclick=()=>$('file').click();$('newp').onclick=()=>$('file').click();
$('dz').ondragover=e=>e.preventDefault();$('dz').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
$('file').onchange=e=>load(e.target.files[0]);$('file').hidden=true;
function load(f){if(!f)return;const url=URL.createObjectURL(f),im=new Image();$('busy').textContent='preparing…';
  im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height));W=Math.round(im.width*s);H=Math.round(im.height*s);
    cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,W,H);
    PIX=x.getImageData(0,0,W,H).data;const N=W*H,L=new Float32Array(N),A=new Float32Array(N),B=new Float32Array(N);

// ---------- click -> region (magic wand in Lab colour space) ----------
function grow(x,y,tol){const N=W*H,m=new Uint8Array(N);let sl=0,sa=0,sb=0,c=0;

  plaster:gs(s,.08,.1)*gs(v,.8,.15)*gs(sd,5,5)*gs(ed,1.5,1.5),
  fabric:gs(ed,9,5)*gs(sd,18,10)*gs(s,.3,.3),
  plastic:gs(s,.45,.35)*gs(ed,2,2)*gs(sd,6,6),
  insulation:gs(h,48,12)*gs(s,.5,.2)*gs(ed,6,5)};
  let tot=0;for(const k in sc){sc[k]+=1e-4;tot+=sc[k]}const best=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];return[best,sc[best]/tot]}
// ---------- pick ----------
$('stage').onclick=e=>{if(!LAB)return;const b=$('photo').getBoundingClientRect();
  const x=Math.min(W-1,Math.max(0,Math.floor((e.clientX-b.left)/b.width*W))),y=Math.min(H-1,Math.max(0,Math.floor((e.clientY-b.top)/b.height*H)));
  $('busy').textContent='analysing…';setTimeout(()=>{
    const m=tidy(grow(x,y,+$('tol').value),x,y);drawMask(m);curCrop=inner(m);
    let R=0,G=0,B=0,n=0;for(let i=0;i<W*H;i++)if(m[i]){R+=PIX[4*i];G+=PIX[4*i+1];B+=PIX[4*i+2];n++}curMean=[R/n,G/n,B/n];
    const f=feats(curCrop),[cat,conf]=classify(f);window.lastInfo={conf,area:Math.round(1000*n/(W*H))/10};apply(cat);$('busy').textContent=''},20)};
const hex2=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function apply(cat){curCat=cat;const I=window.lastInfo||{conf:0,area:0},low=I.conf<.45,
  list=CAT.filter(m=>m.category==cat).map(m=>({m,d:m.color&&curMean?Math.hypot(...hex2(m.color).map((v,i)=>v-curMean[i])):1e3})).sort((a,b)=>a.d-b.d).slice(0,8).map(o=>o.m),top=list[0];
  $('info').innerHTML=`<div class="row"><span class="pill">${cat}</span><b>${low?'possibly ':''}${cat}</b><span class="mut">estimate ${Math.round(I.conf*100)}% · region ${I.area}% of photo</span>
    <select id="ovr">${[...CATS,'other'].map(c=>`<option${c==cat?' selected':''}>${c}</option>`).join('')}</select></div>
    <p class="mut" style="margin-top:8px">Guessed from colour and texture in your browser (no AI model). Wrong? Pick the right material in the list.</p>`+
    (top?`<p class="mut" style="margin:10px 0 4px">Closest catalogue match: <b style="color:var(--ink)">${top.name||'–'}</b></p>${props(top)}`:
      `<p class="mut" style="margin-top:10px">No <b style="color:var(--ink)">${cat}</b> in the catalogue yet. Load a materials.csv to see vendors here. The 3D preview still uses your photo.</p>`);
  $('ovr').onchange=e=>apply(e.target.value);
  $('sims').innerHTML=list.length?list.map(card).join(''):'<span class="mut">No matching swatches in the catalogue.</span>';
  document.querySelectorAll('#sims .sw').forEach(el=>el.onclick=()=>{const m=list[el.dataset.i];$('info').querySelector('table')&&($('info').querySelector('table').outerHTML=props(m));setPBR(pbr(procedural(m),m.category),m.category)});
  setPBR(pbr(curCrop,cat),cat)}
// ---------- PBR maps from a 2D image (cheap estimate) ----------
function procedural(m){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=m.color||COL[m.category]||'#999';x.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)';x.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*4,m.category=='wood'?40*Math.random():2+Math.random()*4)}
  if(m.category=='brick'){x.fillStyle='#d8d2c6';for(let y=0;y<256;y+=32){x.fillRect(0,y,256,3);for(let k=((y/32)%2)*32;k<256;k+=64)x.fillRect(k,y,3,32)}}return c}
function pbr(src,cat){const S=256,c=document.createElement('canvas');c.width=c.height=S;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,S,S);
  const d=cx.getImageData(0,0,S,S).data,N=S*S,g=new Float32Array(N);for(let i=0;i<N;i++)g[i]=(.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2])/255;
  const flat=blur(g,S,S,S/8),fm=flat.reduce((a,b)=>a+b,0)/N,h0=new Float32Array(N);
  for(let i=0;i<N;i++)h0[i]=Math.min(2,g[i]/(flat[i]+.001));let h=blur(h0,S,S,1),mn=1e9,mx=-1e9;for(let i=0;i<N;i++){mn=Math.min(mn,h[i]);mx=Math.max(mx,h[i])}
  for(let i=0;i<N;i++)h[i]=(h[i]-mn)/(mx-mn+1e-6);const h2=h.map(v=>v*v),sd=blur(h2,S,S,4),sm=blur(h,S,S,4);
  const mk=()=>{const k=document.createElement('canvas');k.width=k.height=S;return k},A=mk(),Nn=mk(),Ro=mk(),He=mk(),
    ia=cx.createImageData(S,S),inn=cx.createImageData(S,S),ir=cx.createImageData(S,S),ih=cx.createImageData(S,S),cl=v=>Math.max(0,Math.min(255,v));
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const i=y*S+x,p=4*i,xl=Math.max(0,x-1),xr=Math.min(S-1,x+1),yu=Math.max(0,y-1),yd=Math.min(S-1,y+1),
    gx=h[y*S+xr]-h[y*S+xl],gy=h[yd*S+x]-h[yu*S+x];let nx=-gx*5,ny=-gy*5,nz=1;const nl=Math.hypot(nx,ny,nz);
    for(let k=0;k<3;k++)ia.data[p+k]=cl(d[p+k]/(flat[i]+.001)*fm);ia.data[p+3]=255;
    inn.data[p]=(nx/nl*.5+.5)*255;inn.data[p+1]=(ny/nl*.5+.5)*255;inn.data[p+2]=(nz/nl*.5+.5)*255;inn.data[p+3]=255;
    let rv=Math.min(1,Math.max(.25,.95-3*Math.sqrt(Math.max(sd[i]-sm[i]*sm[i],0))*3));if(cat=='metal')rv=Math.min(.6,Math.max(.15,rv*.5));if(cat=='glass')rv=.05;
    ir.data[p]=ir.data[p+1]=ir.data[p+2]=rv*255;ir.data[p+3]=255;ih.data[p]=ih.data[p+1]=ih.data[p+2]=h[i]*255;ih.data[p+3]=255}
  A.getContext('2d').putImageData(ia,0,0);Nn.getContext('2d').putImageData(inn,0,0);Ro.getContext('2d').putImageData(ir,0,0);He.getContext('2d').putImageData(ih,0,0);
  return{albedo:A,normal:Nn,roughness:Ro,height:He,metalness:cat=='metal'?1:0,opacity:cat=='glass'?.25:1}}
// ---------- 3D viewer (drag to rotate) ----------
const box=$('three'),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,50);cam.position.set(0,0,3.2);
const ren=new THREE.WebGLRenderer({antialias:true});box.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.45));const sun=new THREE.DirectionalLight(0xffffff,1.3);scene.add(sun);
let mesh,mat=new THREE.MeshStandardMaterial({color:0x888888});
function size(){ren.setSize(box.clientWidth,box.clientHeight);cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix()}
function build(){if(mesh)scene.remove(mesh);const s=$('shape').value,
  g=s=='sphere'?new THREE.SphereGeometry(1,192,192):s=='cube'?new THREE.BoxGeometry(1.6,1.6,1.6,96,96,96):new THREE.PlaneGeometry(2.4,1.6,192,128);
  mesh=new THREE.Mesh(g,mat);scene.add(mesh)}
function tex(c,srgb){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.MirroredRepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;return t}
function setPBR(p){Object.assign(mat,{map:tex(p.albedo,1),normalMap:tex(p.normal),roughnessMap:tex(p.roughness),displacementMap:tex(p.height),color:new THREE.Color(0xffffff),metalness:p.metalness,roughness:1,transparent:p.opacity<1,opacity:p.opacity,needsUpdate:true});tiling()}
function tiling(){const t=+$('tile').value;['map','normalMap','roughnessMap','displacementMap'].forEach(k=>mat[k]&&mat[k].repeat.set(t,t));mat.displacementScale=+$('disp').value}
['tile','disp'].forEach(i=>$(i).oninput=tiling);$('shape').onchange=build;
$('light').oninput=()=>sun.position.set(Math.cos($('light').value)*3,2,Math.sin($('light').value)*3);sun.position.set(2,2,2);
let drag=null;ren.domElement.onpointerdown=e=>drag=[e.clientX,e.clientY];addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag||!mesh)return;mesh.rotation.y+=(e.clientX-drag[0])*.01;mesh.rotation.x+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY]});
addEventListener('resize',size);size();build();browse();(function loop(){requestAnimationFrame(loop);ren.render(scene,cam)})();
</script></body></html>
