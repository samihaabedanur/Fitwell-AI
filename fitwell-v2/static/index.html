<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FITWELL · Material Finder</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e3e1dc;--acc:#e8631a}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#f1efea;--mute:#a09e98;--line:#34332f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
header b{font-size:18px}header span{color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:20px 24px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
#stage{position:relative;display:inline-block;max-width:100%;cursor:crosshair}
#stage img,#stage canvas{display:block;max-width:100%;height:auto;border-radius:8px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.drop{border:2px dashed var(--line);border-radius:10px;padding:36px;text-align:center;color:var(--mute);cursor:pointer}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;font-size:12px;background:var(--card)}
.sw:hover{border-color:var(--acc)}.sw img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line);display:block}
.sw div{padding:6px 8px}.mut{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{color:var(--mute);width:42%}
#three{width:100%;height:340px;border-radius:8px;background:#222;touch-action:none}
</style></head><body>
<header><b>FITWELL</b><span>click any surface in your photo to identify it, source it, and preview it in 3D</span></header>
<main>
<section>
  <div class="card"><h3>1 · Photo</h3>
    <div id="dz" class="drop">Drop a photo here, or click to choose<input id="file" type="file" accept="image/*" hidden></div>
    <div id="stage" hidden><img id="photo" alt="uploaded"><canvas id="ov"></canvas></div>
    <div class="row" style="margin-top:10px" id="ctl" hidden>
      <label class="mut">Selection tolerance <input id="tol" type="range" min="4" max="40" value="14"></label>
      <span class="mut" id="mode"></span><span class="mut" id="busy"></span></div>
  </div>
  <div class="card"><h3>Browse catalogue</h3>
    <div class="row"><input id="q" type="text" placeholder="Search name or vendor">
      <select id="cat"><option value="">All categories</option></select>
      <input id="mp" type="text" size="8" placeholder="Max €/m²"><input id="mg" type="text" size="8" placeholder="Max kgCO₂e">
      <button id="go" class="ghost">Search</button></div>
    <p class="mut" id="tot"></p><div class="grid" id="browse"></div></div>
</section>
<section>
  <div class="card"><h3>2 · Material</h3><div id="info" class="mut">Nothing selected yet.</div></div>
  <div class="card"><h3>3 · 3D materiality</h3>
    <div id="three"></div>
    <div class="row" style="margin-top:10px">
      <select id="shape"><option>sphere</option><option>cube</option><option>wall</option></select>
      <label class="mut">Tiling <input id="tile" type="range" min="1" max="8" step=".5" value="2"></label>
      <label class="mut">Relief <input id="disp" type="range" min="0" max=".15" step=".005" value=".03"></label>
      <label class="mut">Light <input id="light" type="range" min="0" max="6.28" step=".05" value="1"></label></div></div>
  <div class="card"><h3>Vendors &amp; similar swatches</h3><div class="grid" id="sims"><span class="mut">Select an area first.</span></div></div>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);let SID=null,W=0,H=0,cur=null;
const money=v=>v==null?'–':'€'+Math.round(v);
// ---------- upload + click-to-segment ----------
$('dz').onclick=()=>$('file').click();
$('dz').ondragover=e=>e.preventDefault();
$('dz').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
$('file').onchange=e=>load(e.target.files[0]);
async function load(f){if(!f)return;$('photo').src=URL.createObjectURL(f);$('dz').hidden=true;$('stage').hidden=false;$('ctl').hidden=false;
  $('busy').textContent='segmenting…';const fd=new FormData();fd.append('file',f);
  const r=await (await fetch('/api/segment',{method:'POST',body:fd})).json();
  SID=r.image_id;W=r.width;H=r.height;$('mode').textContent='engine: '+r.mode;$('busy').textContent='click a surface';}
$('stage').onclick=async e=>{if(!SID)return;const b=$('photo').getBoundingClientRect();
  const x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H;$('busy').textContent='analysing…';
  const r=await (await fetch('/api/pick',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image_id:SID,x,y,tolerance:+$('tol').value})})).json();
  if(r.error){$('busy').textContent=r.error;return}
  $('busy').textContent='';drawMask(r.mask);$('mode').textContent='engine: '+r.engine;show(r);setPBR(r.pbr,r.category);sims(r.matches);};
function drawMask(src){const c=$('ov'),i=new Image();i.onload=()=>{c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0)};i.src=src}
function show(r){const m=r.matches[0]||null,low=r.confidence<.45;
  $('info').innerHTML=`<div class="row"><span class="pill">${r.category}</span><b>${low?'possibly ':''}${r.label}</b><span class="mut">confidence ${Math.round(r.confidence*100)}% · ${r.classifier} · region ${r.area_pct}% of photo</span></div>`+
  (m?`<p class="mut" style="margin:10px 0 4px">Closest catalogue match: <b style="color:var(--ink)">${m.name||'–'}</b></p>${props(m)}`
    :`<p class="mut" style="margin-top:10px">No <b style="color:var(--ink)">${r.category}</b> in the catalogue yet. Add rows to data/materials.csv to see vendors and properties here. The 3D preview below still uses your photo.</p>`)}
function props(m){const g=m.gwp,w=g==null?0:Math.max(4,Math.min(100,(g+20)*1.6));
  return `<table><tr><td>Vendor</td><td>${m.vendor?(m.vendor_url?`<a href="${m.vendor_url}" target="_blank" rel="noopener">${m.vendor}</a>`:m.vendor):'–'}</td></tr>
  <tr><td>Price</td><td>${money(m.price)} / m²</td></tr><tr><td>Origin</td><td>${[m.city,m.country].filter(Boolean).join(', ')||'–'}${m.distance_km!=null?` · ${m.distance_km} km from site`:''}</td></tr>
  <tr><td>Lead time</td><td>${m.lead!=null?m.lead+' days':'–'}</td></tr><tr><td>GWP (kgCO₂e/m²)</td><td>${g??'–'}<div class="bar"><i style="width:${w}%"></i></div></td></tr>
  <tr><td>Specs</td><td>${m.specs||'–'}</td></tr></table>`}
function sims(list){if(!list.length){$('sims').innerHTML='<span class="mut">No matching swatches in the catalogue.</span>';return}$('sims').innerHTML=list.map((m,i)=>`<div class="sw" data-i="${i}"><img src="${m.image?'/data/'+m.image:''}" alt=""><div><b>${m.name||'?'}</b><br><span class="mut">${m.vendor||''} · ${money(m.price)}</span></div></div>`).join('');
  document.querySelectorAll('#sims .sw').forEach(el=>el.onclick=()=>pick(list[el.dataset.i]))}
async function pick(m){$('info').querySelector('table')&&($('info').querySelector('table').outerHTML=props(m));
  const p=await (await fetch('/api/pbr/'+m.id,{method:'POST'})).json();setPBR(p,m.category)}
// ---------- browse ----------
async function browse(){const p=new URLSearchParams({q:$('q').value,category:$('cat').value,max_price:$('mp').value,max_gwp:$('mg').value});
  [...p].forEach(([k,v])=>!v&&p.delete(k));const r=await (await fetch('/api/materials?'+p)).json();
  if($('cat').options.length==1)r.categories.forEach(c=>$('cat').add(new Option(c,c)));
  $('tot').textContent=r.total+' materials';$('browse').innerHTML=r.items.map((m,i)=>`<div class="sw" data-i="${i}"><img src="${m.image?'/data/'+m.image:''}" alt=""><div><b>${m.name}</b><br><span class="mut">${m.vendor||''} · ${money(m.price)}</span></div></div>`).join('');
  document.querySelectorAll('#browse .sw').forEach(el=>el.onclick=()=>{$('info').innerHTML=`<div class="row"><span class="pill">${r.items[el.dataset.i].category}</span><b>${r.items[el.dataset.i].name}</b></div>`+props(r.items[el.dataset.i]);pick(r.items[el.dataset.i])})}
$('go').onclick=browse;browse();
// ---------- 3D viewer (no external controls: drag to rotate) ----------
const box=$('three'),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,50);cam.position.set(0,0,3.2);
const ren=new THREE.WebGLRenderer({antialias:true});box.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.45));const sun=new THREE.DirectionalLight(0xffffff,1.3);scene.add(sun);
let mesh,mat=new THREE.MeshStandardMaterial({color:0x888888}),texs={};
function size(){ren.setSize(box.clientWidth,box.clientHeight);cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix()}
function build(){if(mesh)scene.remove(mesh);const s=$('shape').value;
  const g=s=='sphere'?new THREE.SphereGeometry(1,192,192):s=='cube'?new THREE.BoxGeometry(1.6,1.6,1.6,96,96,96):new THREE.PlaneGeometry(2.4,1.6,192,128);
  mesh=new THREE.Mesh(g,mat);scene.add(mesh)}
function tex(src,srgb){return new Promise(res=>new THREE.TextureLoader().load(src,t=>{t.wrapS=t.wrapT=THREE.MirroredRepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;res(t)}))}
async function setPBR(p,cat){const [a,n,r,h]=await Promise.all([tex(p.albedo,1),tex(p.normal),tex(p.roughness),tex(p.height)]);
  Object.assign(mat,{map:a,normalMap:n,roughnessMap:r,displacementMap:h,color:new THREE.Color(0xffffff),metalness:p.metalness,roughness:1,transparent:p.opacity<1,opacity:p.opacity,needsUpdate:true});tiling();}
function tiling(){const t=+$('tile').value;['map','normalMap','roughnessMap','displacementMap'].forEach(k=>mat[k]&&mat[k].repeat.set(t,t));mat.displacementScale=+$('disp').value}
['tile','disp'].forEach(i=>$(i).oninput=tiling);$('shape').onchange=build;
$('light').oninput=()=>sun.position.set(Math.cos($('light').value)*3,2,Math.sin($('light').value)*3);sun.position.set(2,2,2);
let drag=null;ren.domElement.onpointerdown=e=>drag=[e.clientX,e.clientY];addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag||!mesh)return;mesh.rotation.y+=(e.clientX-drag[0])*.01;mesh.rotation.x+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY]});
addEventListener('resize',size);size();build();(function loop(){requestAnimationFrame(loop);ren.render(scene,cam)})();
</script></body></html>
