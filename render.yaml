services:
  - type: web
    name: fitwell-web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_MODEL_SPACE
        value: HetaKalyani/fitwell-model-server
      - key: NEXT_PUBLIC_PLANNER_URL
        value: https://samihaabedanur.github.io/Fitwell-AI/docs/editor.html
  - type: web
    name: fitwell-api
    runtime: python
    buildCommand: pip install -r backend_requirements.txt
    startCommand: gunicorn backend_app:app
    envVars:
      - key: FITWELL_API_TOKEN
        generateValue: true
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: MELTFLEX_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FITWELL_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: fitwell-site
    runtime: static
    buildCommand: ""
    staticPublishPath: ./docs
